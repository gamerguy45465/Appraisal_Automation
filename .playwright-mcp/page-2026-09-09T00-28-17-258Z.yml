    - generic [ref=e186]: R3 AMC (R3 Appraisal Management Company) is a full-service Appraisal Management Company headquartered in Henderson, Nevada, providing residential appraisal management, private appraisals, compliance solutions, and loan officer marketing tools to mortgage lenders and consumers nationwide. Founded in 2015 by Brent Jones, former Fannie Mae senior analyst with over 30 years of appraisal experience, R3 AMC serves lenders with Listing Agent Engage marketing services and AIR/Dodd-Frank compliant appraisal coordination. R3 AMC also accepts private appraisal inquiries directly from homeowners and consumers. The company differentiates itself as an AMC founded by practicing appraisers, committed to fair fees, open communication, and helping loan officers strengthen referral relationships.
    - paragraph [ref=e213]: Whether a local assignment in Las Vegas or throughout the country, we can assist.
    - generic [ref=e226]:
      - generic [ref=e227]:
        - paragraph [ref=e228]: Clients come to R3 AMC frustrated by late appraisals, shifting contacts within AMCs, revision delays, and a lack of urgency. We were built to solve those problems.
        - paragraph [ref=e229]: Our principals bring more than 60 years of combined appraisal experience, including leadership from Brent Jones, a noted appraisal educator and former Senior Analyst covering the western United States for Fannie Mae.
        - paragraph [ref=e230]: We balance appraisal independence requirements with proactive communication and technology-supported workflows that keep transactions moving.
      - generic [ref=e231]: Nevada’s Largest Appraisal Company
